<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nexa App Icon</title>
  <desc id="desc">Rounded navy square with a white and blue geometric N mark.</desc>
  <defs>
    <radialGradient id="bg" cx="20%" cy="10%" r="115%">
      <stop offset="0%" stop-color="#0b4d86"/>
      <stop offset="28%" stop-color="#082b50"/>
      <stop offset="68%" stop-color="#061a31"/>
      <stop offset="100%" stop-color="#030c18"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25e6ee"/>
      <stop offset="42%" stop-color="#16a9ff"/>
      <stop offset="100%" stop-color="#1258ff"/>
